name: Live Star Counter

on:
  watch:
    types: [started]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Sync README star counter
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = "main";
            const path = "README.md";

            const repository = await github.rest.repos.get({ owner, repo });
            const stars = repository.data.stargazers_count;

            const file = await github.rest.repos.getContent({ owner, repo, path, ref });
            if (Array.isArray(file.data) || !file.data.content) {
              throw new Error("README.md could not be read as a file");
            }

            const current = Buffer.from(file.data.content, "base64").toString("utf8");
            const badge = `https://img.shields.io/github/stars/${owner}/${repo}?style=for-the-badge&label=STARS&cacheSeconds=60&v=${stars}`;

            let updated = current.replace(
              /https:\/\/img\.shields\.io\/github\/stars\/MrCheeku\/(?:PassGen|SentinelX)\?style=for-the-badge&label=STARS[^)\"\s]*/,
              badge
            );

            updated = updated.replace(/<!-- LIVE_STARS:.*? -->\n?/g, "").trimEnd();
            updated += `\n\n<!-- LIVE_STARS: ${stars} | automatically synced ${new Date().toISOString()} -->\n`;

            if (updated === current) {
              core.info(`README already reflects ${stars} stars.`);
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `chore: sync live star counter (${stars})`,
              content: Buffer.from(updated, "utf8").toString("base64"),
              sha: file.data.sha,
              branch: ref,
            });

            core.info(`README star counter synced to ${stars}.`);