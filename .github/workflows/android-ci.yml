name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passgen-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run JVM and Robolectric tests
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if gradle test 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if ! grep -Eiq '(429|Too Many Requests|Could not GET|Could not download)' "$log_file"; then
              rm -f "$log_file"
              exit 1
            fi
            rm -f "$log_file"
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle dependency download remained rate-limited after 3 attempts."
              exit 1
            fi
            echo "Maven dependency download was rate-limited; retrying in $((attempt * 15)) seconds."
            sleep "$((attempt * 15))"
          done
      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if gradle assembleDebug 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if ! grep -Eiq '(429|Too Many Requests|Could not GET|Could not download)' "$log_file"; then
              rm -f "$log_file"
              exit 1
            fi
            rm -f "$log_file"
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle dependency download remained rate-limited after 3 attempts."
              exit 1
            fi
            echo "Maven dependency download was rate-limited; retrying in $((attempt * 15)) seconds."
            sleep "$((attempt * 15))"
          done
