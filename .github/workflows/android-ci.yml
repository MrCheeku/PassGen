name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run JVM and Robolectric tests with coverage
        run: gradle :app:koverXmlReportDebug :app:koverHtmlReportDebug --no-daemon

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passgen-coverage-report
          path: app/build/reports/kover/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
